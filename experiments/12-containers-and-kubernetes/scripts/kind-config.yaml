# kind 单节点集群。
# 任务书 4.4 的坑：Deployment 里的 hostPath 指的是 **kind 节点容器内部**的路径，
# 不是 Windows/WSL 宿主机路径。必须用 extraMounts 把宿主机目录映射进节点，
# 否则 Pod 会以为路径存在、挂上一个空目录，然后模型加载失败。
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraMounts:
      - hostPath: /mnt/d/llm-infra-day12/models   # WSL 里看到的 D:\llm-infra-day12\models
        containerPath: /models
        readOnly: true
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
