apiVersion: v1
kind: Service
metadata:
  name: sod
spec:
  type: ClusterIP
  selector: {app: sod}
  ports:
    - name: http
      port: 80
      targetPort: http
---
# 对外访问：NodePort + kind 的 extraPortMappings 把 30080 映到宿主机 30080
apiVersion: v1
kind: Service
metadata:
  name: sod-nodeport
spec:
  type: NodePort
  selector: {app: sod}
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
