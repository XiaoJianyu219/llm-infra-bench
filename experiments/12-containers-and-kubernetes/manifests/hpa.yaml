apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sod
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # 相对 requests.cpu(500m) 的百分比，不是相对 limits，也不是相对整机
          averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0     # 扩容不等待，尽快响应
      policies: [{type: Pods, value: 2, periodSeconds: 15}]
    scaleDown:
      stabilizationWindowSeconds: 300   # 缩容默认 5 分钟稳定窗口，防抖
      policies: [{type: Pods, value: 1, periodSeconds: 60}]
